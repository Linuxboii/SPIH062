<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OncoLens — Grounded biomedical research</title>
    <meta
      name="description"
      content="A grounded biomedical research assistant for oncology drug discovery. Every claim traceable to real retrieved data."
    />

    <!-- Resolve the theme before first paint. Without this the page
         renders light, then repaints dark once React mounts. Must stay
         in sync with the KEY and ORDER in src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('oncolens-theme');
          if (p !== 'light' && p !== 'dark' && p !== 'system') p = 'system';
          var dark =
            p === 'dark' ||
            (p === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = dark ? 'dark' : 'light';
          r.dataset.themePref = p;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <!-- mobile browser chrome follows the theme -->
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101413" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
